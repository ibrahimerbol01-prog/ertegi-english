    <a-entity laser-controls="hand:left" raycaster="objects:.clickable;far:10" line="color:#FF7A4D;opacity:0.8"></a-entity>
  </a-entity>
</a-scene>`);
  const sc=document.querySelector('a-scene'),tip=document.getElementById('tip');
  sc.addEventListener('enter-vr',()=>{tip.style.visibility='hidden';if(!hiPlayed)setTimeout(shoqanHi,1500);});

  const gb=document.getElementById('go');gb.disabled=false;gb.style.opacity=1;
  gb.addEventListener('click',()=>{const w=document.getElementById('welcome');w.classList.add('hide');setTimeout(()=>w.remove(),600);shoqanHi();
    try{if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok)sc.enterVR();}).catch(()=>{});}catch(e){}});sc.addEventListener('exit-vr',()=>{tip.style.visibility='visible'});
}
</script>
